# Triggers on version tags (e.g. v1.0.0).
# Produces two release artifacts:
#   1. MacCleaner-{version}-macos-universal.zip — full .app bundle built from
#      source (GUI users, Apple Silicon + Intel)
#   2. MacCleaner-{version}-cli.tar.gz          — CLI-only files (headless users)
#
# Note: GITHUB_REF_NAME is the tag name pushed by the repo owner.
# No user-controlled event input is used in any run: block.

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Package and Publish Release
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          echo "version=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${TAG_NAME}"

      - name: Verify Python syntax before packaging
        run: python3 -m py_compile cleaner.py

      - name: Run unit tests
        run: python3 -m unittest discover -s tests

      - name: Build app bundle from source
        run: bash app/build.sh

      - name: Detect signing credentials
        id: signing
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE_P12 }}
        run: |
          # `secrets` cannot be referenced in any `if:` — job or step. `env`
          # can, but only in a step-level `if:`. So probe here, publish a
          # boolean, and gate the real steps on the output.
          if [ -n "$CERT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "→ Signing credentials present — will sign and notarize"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "→ No signing credentials — shipping an ad-hoc signed build"
          fi

      - name: Sign, notarize, and staple
        if: steps.signing.outputs.enabled == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          APP="build/MacCleaner.app"

          # 1. Import the certificate into a throwaway keychain.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PWD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PWD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # Without this, codesign blocks on a GUI keychain prompt that never comes.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PWD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity in the imported certificate."
            exit 1
          fi

          # 2. Sign. --options runtime (hardened runtime) is mandatory for
          # notarization; --timestamp is required for a distributable signature.
          # No entitlements file is needed: the only Mach-O is Contents/MacOS/
          # MacCleaner, and it launches /usr/bin/python3 as a separate
          # Apple-signed process, which the hardened runtime does not restrict.
          codesign --force --deep --options runtime --timestamp \
            --sign "$IDENTITY" --keychain "$KEYCHAIN" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          # 3. Notarize. notarytool cannot take a bare .app — only .zip/.dmg/.pkg.
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$NOTARY_PASSWORD" --wait

          # 4. Staple the ticket to the .app (not the zip) so it validates offline.
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          echo "✅ Signed, notarized, and stapled"

      - name: Remove signing keychain
        if: always() && steps.signing.outputs.enabled == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - name: Package app bundle as zip
        id: package_app
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APP_ZIP="MacCleaner-${VERSION}-macos-universal.zip"

          if [ -d "build/MacCleaner.app" ]; then
            # ditto preserves macOS extended attributes and code signatures.
            # Never use `zip -r` for .app bundles — it strips these.
            ditto -c -k --sequesterRsrc --keepParent build/MacCleaner.app "${APP_ZIP}"
            echo "app_zip=${APP_ZIP}" >> "$GITHUB_OUTPUT"
            echo "app_zip_exists=true" >> "$GITHUB_OUTPUT"
            echo "Packaged: ${APP_ZIP} ($(du -sh ${APP_ZIP} | cut -f1))"
          else
            echo "app_zip_exists=false" >> "$GITHUB_OUTPUT"
            echo "build/MacCleaner.app not found — skipping app bundle artifact."
          fi

      - name: Package CLI-only tarball
        id: package_cli
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CLI_DIR="MacCleaner-${VERSION}-cli"
          CLI_TAR="${CLI_DIR}.tar.gz"

          mkdir -p "${CLI_DIR}"
          cp cleaner.py install.sh scheduler.sh config.json README.md AGENTS.md LICENSE "${CLI_DIR}/"

          # Copy only the completion scripts, not the test harness
          mkdir -p "${CLI_DIR}/completions"
          [ -f completions/_maccleaner ] && cp completions/_maccleaner "${CLI_DIR}/completions/"
          [ -f completions/maccleaner.bash ] && cp completions/maccleaner.bash "${CLI_DIR}/completions/"

          echo "${VERSION}" > "${CLI_DIR}/VERSION"

          tar -czf "${CLI_TAR}" "${CLI_DIR}/"
          rm -rf "${CLI_DIR}"

          echo "cli_tar=${CLI_TAR}" >> "$GITHUB_OUTPUT"
          echo "Packaged: ${CLI_TAR} ($(du -sh ${CLI_TAR} | cut -f1))"

      - name: Generate release notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          {
            echo "## Installation"
            echo ""
            echo "### Option 1 — Full App (GUI + CLI)"
            echo "Download \`MacCleaner-${VERSION}-macos-universal.zip\`, unzip, and run:"
            echo '```bash'
            echo "bash install.sh"
            echo "open ~/Applications/MacCleaner.app"
            echo '```'
            if [ "${{ steps.signing.outputs.enabled }}" != "true" ]; then
              echo "> **First launch:** macOS may block the app (it is not yet notarized)."
              echo "> Right-click MacCleaner.app → Open → confirm."
              echo ""
            fi
            echo "### Option 2 — CLI only"
            echo "Download \`MacCleaner-${VERSION}-cli.tar.gz\` and run:"
            echo '```bash'
            echo "tar -xzf MacCleaner-${VERSION}-cli.tar.gz"
            echo "cd MacCleaner-${VERSION}-cli"
            echo "bash install.sh"
            echo '```'
            echo ""
            echo "## Requirements"
            echo "- CLI: any macOS with Python 3 (pre-installed)"
            echo "- App: macOS 13 Ventura or later (universal: Apple Silicon + Intel)"
            echo ""
            echo "## For AI agents"
            echo "Every command supports \`--json\` — see \`AGENTS.md\` for the full machine interface."
          } > release_notes.md

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: "MacCleaner ${{ steps.version.outputs.version }}"
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          files: |
            ${{ steps.package_cli.outputs.cli_tar }}
            ${{ steps.package_app.outputs.app_zip_exists == 'true' && steps.package_app.outputs.app_zip || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
