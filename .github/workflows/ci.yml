# Runs on every push and pull request to main.
# Validates Python syntax, runs the unit test suite, and smoke-tests the CLI
# (both v2 subcommands and legacy v1 flags) on a real macOS runner.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-smoke-test:
    name: Tests + Smoke Test
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify Python 3 is available
        run: python3 --version

      - name: Check Python syntax
        run: python3 -m py_compile cleaner.py

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Check shell completion syntax
        run: |
          zsh -n completions/_maccleaner
          bash -n completions/maccleaner.bash
          echo "✅ completion files parse"

      - name: Run shell completion behavior suite
        run: bash completions/run_tests.sh

      - name: Build MacCleanerKit (V3 Stage 2, read-only Swift kit)
        run: swift build -c release --package-path swift/MacCleanerKit

      - name: Swift/Python engine parity (tools/check_swift_parity.py)
        run: python3 tools/check_swift_parity.py

      - name: Smoke test — scan --json
        run: python3 cleaner.py scan --json | python3 -m json.tool > /dev/null

      - name: Smoke test — legacy --json contract (menu bar app)
        run: python3 cleaner.py --json | python3 -m json.tool > /dev/null

      - name: Smoke test — legacy --preview
        run: python3 cleaner.py --preview

      - name: Smoke test — doctor
        run: python3 cleaner.py doctor

      - name: Smoke test — categories --json
        run: python3 cleaner.py categories --json | python3 -m json.tool > /dev/null

      - name: Smoke test — projects --json
        run: python3 cleaner.py projects --json | python3 -m json.tool > /dev/null

      - name: Smoke test — help
        run: python3 cleaner.py --help

  build-app:
    name: Build macOS app
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build MacCleaner.app from source
        run: bash app/build.sh

      - name: Verify bundle structure
        run: |
          test -x build/MacCleaner.app/Contents/MacOS/MacCleaner
          test -f build/MacCleaner.app/Contents/Info.plist
          test -f build/MacCleaner.app/Contents/Resources/cleaner.py

      - name: Verify Sparkle actually embedded
        run: |
          # build.sh only falls back to -DSPARKLE_DISABLED outside CI (its
          # own [ -n "${CI:-}" ] check) -- GitHub Actions always sets CI=true,
          # so on this job a missing/unlinked Sparkle.framework means the
          # fetch-or-fatal contract silently regressed. Fail loudly instead
          # of shipping a CI-green app that can't self-update.
          test -f build/MacCleaner.app/Contents/Frameworks/Sparkle.framework/Versions/B/Sparkle
          otool -L build/MacCleaner.app/Contents/MacOS/MacCleaner | grep -q Sparkle.framework
